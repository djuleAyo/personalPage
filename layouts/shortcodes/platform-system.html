  <details class="platform-map-details">
    <summary>Connection notes</summary>
    <dl>
      <dt>Shell implementations</dt><dd>Web and Unity implement Shell. The user interacts with these shells. Web contains Worker Studio as an application; Unity renders spatial and Web application surfaces.</dd>
      <dt>Graph interaction</dt><dd>Shell input reaches PIM, the linearizer of the Molecule SSOT graph. Driver agents can send input directly to PIM.</dd>
      <dt>Streams and models</dt><dd>Shell audio and video streams enter Mixer. Mixer calls local model services, receives their results and publishes events on NATS.</dd>
      <dt>Applications and services</dt><dd>Worker Studio connects coding-agent providers through adapters. Reader uses model services for speech synthesis and playback.</dd>
    </dl>
